[package]
name = "dnf-autofire"
version = "0.1.0"
edition = "2021"
authors = ["Arthur"]

[[bin]]
name = "dnf-autofire"
path = "src/main.rs"

[[bin]]
name = "detect-window"
path = "src/bin/detect-window.rs"

[dependencies]
parking_lot = "0.12"
once_cell = "1.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Windows API 绑定
[dependencies.windows]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_Media",
    "Win32_Security",
]

# Native Windows GUI
[dependencies.native-windows-gui]
version = "1.0"
features = ["extern-canvas"]

[build-dependencies]
embed-resource = "2.5"

[profile.release]
opt-level = 3           # 性能优先
lto = true              # 链接时优化
codegen-units = 1       # 单线程编译
strip = true            # 移除符号表
panic = "abort"         # panic 时直接终止
