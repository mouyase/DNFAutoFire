[package]
name = "dnf-autofire"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Your Name"]
description = "DNF AutoFire Tool - 高性能连发工具"
readme = "README.md"
license = "MIT"
keywords = ["dnf", "autofire", "keyboard", "gaming"]
categories = ["games", "gui"]
repository = ""

[lints.rust]
# unsafe_code = "warn"  # 本项目需要调用 Windows API，允许 unsafe
unused = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
# nursery = "warn"  # 太严格，暂时关闭
# 允许的 lint
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
missing_docs_in_private_items = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
similar_names = "allow"

[dependencies]
# GUI 框架
eframe = "0.30"
egui = "0.30"

# Windows API
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
    "Win32_System_LibraryLoader",
    "Win32_Media",
]}

# 序列化（配置文件）
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 其他工具
once_cell = "1.19"
parking_lot = "0.12"

# 开发构建配置
[profile.dev]
opt-level = 0
debug = true

# 发布构建配置
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# 测试构建配置
[profile.test]
opt-level = 0
debug = true

[build-dependencies]
# Windows 应用程序清单（管理员权限）
winres = "0.1"

[[bin]]
name = "dnf-autofire"
path = "src/main.rs"

# 测试程序（开发时使用）
[[bin]]
name = "test_multi2"
path = "src/bin/test_multi2.rs"

[[bin]]
name = "test_final"
path = "src/bin/test_final.rs"
